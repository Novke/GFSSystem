name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        # AWS ogledalo zvanične slike: Docker Hub bez naloga ima limit po IP-u runnera (CI je padao pre build-a)
        image: public.ecr.aws/docker/library/mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: gftest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build i testovi (contextLoads protiv MySQL servisa)
        run: chmod +x mvnw && ./mvnw -B package
      - name: Provera Dockerfile-a
        run: docker build -t gfs-backend-ci .
