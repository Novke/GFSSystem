name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: gftest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build i testovi (contextLoads protiv MySQL servisa)
        run: chmod +x mvnw && ./mvnw -B package
      - name: Provera Dockerfile-a
        run: docker build -t gfs-backend-ci .
