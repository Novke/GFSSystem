spring.application.name=GFSSystem

spring.datasource.username=root

# Šemom upravlja Flyway (src/main/resources/db/migration); Hibernate je samo proverava.
# Postojeća baza bez flyway_schema_history (gf, gf_staging) dobija baseline na verziji 1 (V1 = šema gf),
# pa se izvršavaju V2 i dalje (V2-V4, V6-V11 i V15 su idempotentne). Prazna baza (CI gftest) izvršava sve od V1.
# Nove izmene šeme: V5 je trajno neiskorišćena (namerna rupa, nikad se ne koristi), V6 = prag_prolaza, V7 = uživo,
# V8 = platno slajdova, V9 = wa_link grupe, V10 = prelaz slajda, V11 = banka zadataka, V15 = prijava (privremeni broj
# grane feature/prijava; V12-V14 su privremeno zauzete drugim granama, pri merge-u u staging prijava dobija sledeći
# slobodan broj), sledeća slobodna verzija je V16,
# i svaka nova migracija mora biti idempotentna (reset staging baze gradi šemu iz dump-a produkcije).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true

#CORS
gfs.front.url = http://localhost:4200, http://sistem.gfs:4200, http://127.0.0.1:4200

# Jackson 3 (Boot 4) sa podrazumevanim vrednostima kao Jackson 2 u Boot 3: null u primitivno polje daje 0,
# visak teksta posle JSON-a se ignorise, redosled polja u odgovoru kao ranije
spring.jackson.use-jackson2-defaults=true

# Liste (Pageable): podrazumevano 25 po stranici, size preko 100 se svodi na 100, Page ide u JSON kao
# {content, page: {size, number, totalElements, totalPages}} (PagedModel). Namerno preko svojstava a ne
# @EnableSpringDataWebSupport: ta anotacija gasi Boot-ov DataWebAutoConfiguration i sa njim ova ograničenja.
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# Uživo (interaktivna prezentacija): slike slajdova i pitanja kao fajlovi; u kontejneru GFS_MEDIJI_DIR
gfs.mediji.dir=${GFS_MEDIJI_DIR:${java.io.tmpdir}/gfs-mediji}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Tomcat cita do 11 MB tela koje odbija sa 413 (uvoz slajdova), da nginx dobije JSON 413 umesto prekida veze/502
server.tomcat.max-swallow-size=11MB
# Backend je iza dva nginx-a: Tomcat (RemoteIpValve) postavlja pravi IP klijenta (getRemoteAddr) i protokol (isSecure) iz
# X-Forwarded-For/-Proto; zdesna preskace pouzdane privatne proksije. Isto u testu (ProksiZagljavljaIT).
server.forward-headers-strategy=native

# Banka zadataka: render servis za LaTeX (kontejner gfs-latex, spec 3.1). Klijent čeka timeout-sekunde,
# servis dobija 10 s manje (najmanje 10), pa uvek prvi javi svoj timeout.
gfs.latex.url=${GFS_LATEX_URL:http://localhost:8800}
gfs.latex.timeout-sekunde=30

# Prijava nastavnika (spec 4.1): korisnik i bcrypt heš lozinke iz okruženja (heš pravi deploy/hes-lozinke). Prazno = prijava
# nastavnika nije podešena (503, ADMIN putanje ostaju zaključane); heš pogrešnog oblika (npr. sirova lozinka) ruši start.
gfs.nastavnik.korisnik=${GFS_NASTAVNIK_KORISNIK:}
gfs.nastavnik.lozinka-bcrypt=${GFS_NASTAVNIK_LOZINKA_BCRYPT:}
gfs.nastavnik.mejl=${GFS_NASTAVNIK_MEJL:}

# Mejl (spec 7): SMTP iz okruženja; prazan GFS_MAIL_HOST ili GFS_MAIL_FROM = slanje isključeno (SmtpMejlServis.dostupan() je false).
# Prod: Gmail, smtp.gmail.com:587 sa STARTTLS; stejdžing: Mailpit, port 1025 i GFS_MAIL_STARTTLS=false. Veza, čitanje i pisanje 10 s.
# mail.smtp.auth se uključuje u kodu (MejlConfig) kad je GFS_MAIL_USER podešen. Pauze između pokušaja slanja: gfs.mail.pauze-ms.
spring.mail.host=${GFS_MAIL_HOST:}
spring.mail.port=${GFS_MAIL_PORT:587}
spring.mail.username=${GFS_MAIL_USER:}
spring.mail.password=${GFS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${GFS_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${GFS_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
gfs.mail.from=${GFS_MAIL_FROM:}
gfs.mail.pauze-ms=2000,10000
