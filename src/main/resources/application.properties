spring.application.name=GFSSystem

spring.datasource.username=root

# Šemom upravlja Flyway (src/main/resources/db/migration); Hibernate je samo proverava.
# Postojeća baza bez flyway_schema_history (gf, gf_staging) dobija baseline na verziji 1 (V1 = šema gf),
# pa se izvršavaju V2 i dalje (V2-V4 i V6-V12 su idempotentne). Prazna baza (CI gftest) izvršava sve od V1.
# Nove izmene šeme: V5 je trajno neiskorišćena (namerna rupa, nikad se ne koristi), V6 = prag_prolaza, V7 = uživo,
# V8 = platno slajdova, V9 = wa_link grupe, V10 = prelaz slajda, V11 = banka zadataka, V12 = MCP banka ako se prvi
# merguje (izvor i serija, ikad odobrena, zamenjuje, isključene teme); B (slajd Zadatak) i prijava uzimaju sledeći slobodan
# broj pri merge-u u staging, pa se broj u imenu fajla menja pre merge-a ako je V12 već zauzet. Sledeća slobodna verzija
# je V13, i svaka nova migracija mora biti idempotentna (reset staging baze gradi šemu iz dump-a produkcije).
# scripts/provera-migracija.sh (CI) odbija dupli broj i novu verziju koja nije iznad najveće u osnovi PR-a.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true

#CORS
gfs.front.url = http://localhost:4200, http://sistem.gfs:4200, http://127.0.0.1:4200

# Jackson 3 (Boot 4) sa podrazumevanim vrednostima kao Jackson 2 u Boot 3: null u primitivno polje daje 0,
# visak teksta posle JSON-a se ignorise, redosled polja u odgovoru kao ranije
spring.jackson.use-jackson2-defaults=true

# Liste (Pageable): podrazumevano 25 po stranici, size preko 100 se svodi na 100, Page ide u JSON kao
# {content, page: {size, number, totalElements, totalPages}} (PagedModel). Namerno preko svojstava a ne
# @EnableSpringDataWebSupport: ta anotacija gasi Boot-ov DataWebAutoConfiguration i sa njim ova ograničenja.
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# Uživo (interaktivna prezentacija): slike slajdova i pitanja kao fajlovi; u kontejneru GFS_MEDIJI_DIR
gfs.mediji.dir=${GFS_MEDIJI_DIR:${java.io.tmpdir}/gfs-mediji}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Tomcat cita do 11 MB tela koje odbija sa 413 (uvoz slajdova), da nginx dobije JSON 413 umesto prekida veze/502
server.tomcat.max-swallow-size=11MB

# Banka zadataka: render servis za LaTeX (kontejner gfs-latex, spec 3.1). Klijent čeka timeout-sekunde,
# servis dobija 10 s manje (najmanje 10), pa uvek prvi javi svoj timeout.
gfs.latex.url=${GFS_LATEX_URL:http://localhost:8800}
gfs.latex.timeout-sekunde=30

# MCP za Kloda (Spring AI 2.0.1, spec MCP sekcije 2 i 3): stateless (jedan JSON odgovor po POST-u, bez SSE), samo alati.
# spring.ai.mcp.server.enabled ne piše se ovde: postavlja ga mcp/McpUkljucenje po tome da li gfs.mcp.kljucevi ima stavki
# (prazno = MCP isključen, /mcp je 404). Ključevi su samo SHA-256 heševi, oznaka:heš razdvojeno zarezom (env GFS_MCP_KLJUCEVI).
# Ista MCP svojstva moraju biti i u src/test/resources/application.properties: taj fajl u testu zaklanja ovaj.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=gfs
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.request-timeout=120s
gfs.mcp.kljucevi=${GFS_MCP_KLJUCEVI:}
# Okruženje koje alat kontekst vraća Klodu (compose: PROD, STAGING; testovi: TEST)
gfs.okruzenje=${GFS_OKRUZENJE:LOKALNO}
