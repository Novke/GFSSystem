spring.datasource.url=jdbc:mysql://localhost:3306/gftest

spring.datasource.username=root
# CORS (CorsConfig radi requireNonNull; ovaj fajl zaklanja glavni application.properties u testu)
gfs.front.url = http://localhost:4200
# Isto kao glavni application.properties (Jackson 3 sa podrazumevanim vrednostima Jackson 2)
spring.jackson.use-jackson2-defaults=true
# Isto kao glavni: Flyway pravi šemu (prazna gftest -> V1, V2, ...), Hibernate je validira
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
# Isto kao glavni (liste): podrazumevano 25 po stranici, najviše 100
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
# Isto kao glavni: slike uživo (u testu poseban direktorijum). Maven (surefire) ga zaklanja sa target/gfs-mediji-test
# svakog checkout-a (pom.xml), da se testovi dva worktree-ja ne vide; ovo je rezerva za pokretanje iz IDE-a.
gfs.mediji.dir=${java.io.tmpdir}/gfs-mediji-test
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Banka zadataka: render servis za LaTeX (kontejner gfs-latex, spec 3.1). Klijent čeka timeout-sekunde,
# servis dobija 10 s manje (najmanje 10), pa uvek prvi javi svoj timeout.
gfs.latex.url=${GFS_LATEX_URL:http://localhost:8800}
gfs.latex.timeout-sekunde=30

# Backend je iza dva nginx-a: Tomcat (RemoteIpValve) postavlja pravi IP klijenta (getRemoteAddr) i protokol (isSecure) iz
# X-Forwarded-For/-Proto; zdesna preskace pouzdane privatne proksije. Isto u testu (ProksiZagljavljaIT).
server.forward-headers-strategy=native

# Nastavnik u testovima: korisnik "nastavnik", lozinka "test-lozinka-123". JAVNA, poznata lozinka samo za testove.
gfs.nastavnik.korisnik=nastavnik
gfs.nastavnik.lozinka-bcrypt=$2a$10$7lFRNXvBfiWO11tnOVFGNuGvKRwB4ckWG9nWjGYMNqivNjMIv5gGi

# Mejl: u testu nikad pravi SMTP (prazan host = slanje isključeno); LazniMejlServis zamenjuje MejlServis, pauze ponavljanja kratke
spring.mail.host=
gfs.mail.from=
gfs.mail.pauze-ms=20,20

# Studentski nalog: bez donje granice trajanja u testovima (KodServisIT je proverava posebno)
gfs.nalog.minimalno-trajanje-ms=0

# Open-in-view registruje OtvorenEntityManagerConfig (sve putanje osim /public/nalog/** i /public/lti/**); Boot-ov je iskljucen
spring.jpa.open-in-view=false

# Testovi drze desetine keširanih Spring konteksta; Hikari bi svaki odmah otvorio 10 veza (podrazumevano minimum-idle = maksimum)
# i premasio max_connections=151 MySQL-a ("Too many connections"). Pul i dalje raste do 10 pod opterecenjem.
spring.datasource.hikari.minimum-idle=2

# MCP: ista svojstva kao glavni fajl (ovaj ga zaklanja, bez njih bi se digao STREAMABLE server ili ništa).
# Ključ je sintetički test ključ gfs_TEST000...0 (samo njegov SHA-256), nikad pravi. version se u test resursima ne
# filtrira, pa ostaje doslovno @project.version@.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=gfs
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.request-timeout=120s
gfs.mcp.kljucevi=test:fba7afe9974287572c8bf87caa175a78ddd3e98e337edad300dce78199168589
gfs.okruzenje=TEST

# Čišćenje prijave se u testovima ne okida samo (u 7. minutu bi svaki keširani kontekst brisao tuđe "sveže" redove ako mu je
# PomerljivSat ostao pomeren); CiscenjePrijaveIT poziva ocisti() direktno.
gfs.prijava.ciscenje.cron=-
gfs.najave.ciscenje.cron=-
